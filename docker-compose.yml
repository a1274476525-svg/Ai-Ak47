version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL — Primary Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aios_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aios_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aios}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aios} -d ${POSTGRES_DB:-aios}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - aios_network

  # ─────────────────────────────────────────
  # Redis — Cache, Sessions, Task Queue
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aios_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - aios_network

  # ─────────────────────────────────────────
  # AI Brain — Python LangGraph Orchestrator
  # ─────────────────────────────────────────
  ai-brain:
    build:
      context: ./ai-brain
      dockerfile: Dockerfile
    container_name: aios_brain
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-aios_secret}@postgres:5432/${POSTGRES_DB:-aios}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_secret}
      VSCODE_WORKSPACE: /vscode-workspace
      EXTENSIONS_DIR: /app/extensions
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    volumes:
      - vscode_workspace:/vscode-workspace
      - ./ai-brain/extensions:/app/extensions
    ports:
      - "${AI_BRAIN_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - aios_network

  # ─────────────────────────────────────────
  # API Gateway — NestJS
  # ─────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: aios_gateway
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-aios_secret}@postgres:5432/${POSTGRES_DB:-aios}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      AI_BRAIN_HOST: ai-brain
      AI_BRAIN_PORT: 8000
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-brain:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aios_network

  # ─────────────────────────────────────────
  # Admin Dashboard — Next.js
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: aios_dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://gateway:3000
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - aios_network

  # ─────────────────────────────────────────
  # Qdrant — Vector Search (Memory Semantic)
  # ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: aios_qdrant
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz | grep -q 'ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - aios_network

  # ─────────────────────────────────────────
  # Sandbox — isolated environment for tool execution
  # ─────────────────────────────────────────
  sandbox:
    image: python:3.12-slim
    container_name: aios_sandbox
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - sandbox_workspace:/workspace
    restart: unless-stopped
    networks:
      - aios_network

  # ─────────────────────────────────────────
  # code-server — VSCode in the browser (Phase 4: AI Workspace)
  # Workspace shared with ai-brain via vscode_workspace volume
  # ─────────────────────────────────────────
  code-server:
    image: codercom/code-server:latest
    container_name: aios_vscode
    user: "1000:1000"
    environment:
      PASSWORD: ${VSCODE_PASSWORD:-vscode_secret}
    volumes:
      - vscode_workspace:/home/coder/workspace
    ports:
      - "${VSCODE_PORT:-8080}:8080"
    command: >
      code-server
      --bind-addr 0.0.0.0:8080
      --auth password
      /home/coder/workspace
    restart: unless-stopped
    networks:
      - aios_network

  # ─────────────────────────────────────────
  # Neo4j — Knowledge Graph
  # ─────────────────────────────────────────
  neo4j:
    image: neo4j:5.18-community
    container_name: aios_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_secret}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - aios_network

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  aios_network:
    driver: bridge
    name: aios_network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    name: aios_postgres_data
  redis_data:
    name: aios_redis_data
  qdrant_data:
    name: aios_qdrant_data
  neo4j_data:
    name: aios_neo4j_data
  neo4j_logs:
    name: aios_neo4j_logs
  sandbox_workspace:
    name: aios_sandbox_workspace
  vscode_workspace:
    name: aios_vscode_workspace
