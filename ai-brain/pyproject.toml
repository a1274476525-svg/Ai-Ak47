[project]
name = "aios-brain"
version = "0.1.0"
description = "AI OS — Brain Service (LangGraph Orchestrator)"
requires-python = ">=3.12"
dependencies = [
    # Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Config & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # AI SDKs
    "anthropic>=0.42.0",
    "openai>=1.57.0",
    # LangGraph / LangChain
    "langgraph>=0.2.60",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.14",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.25",
    # Web search (no API key needed)
    "duckduckgo-search>=6.3.0",
    # Scheduling
    "apscheduler>=3.10.4",
    # Browser automation
    "playwright>=1.50.0",
    # HTML parsing for GitHub Trending
    "beautifulsoup4>=4.12.0",
    # XML parsing for ArXiv
    "feedparser>=6.0.11",
    # Database
    "asyncpg>=0.30.0",
    # Cache
    "redis[hiredis]>=5.2.0",
    # Vector DB
    "qdrant-client[fastembed]>=1.12.0",
    # HTTP client
    "httpx>=0.28.0",
    # Knowledge Graph
    "neo4j>=5.18.0",
    # Utilities
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
